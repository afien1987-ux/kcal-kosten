<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Supabase ----------

const CoinsIcon = (p) => <Icon {...p}><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></Icon>;
const LogOutIcon = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;

// Weitere Slots einfach ergänzen, z.B. "Zweites Frühstück", "Nachmittag" — keine DB-Änderung nötig.
const MAHLZEIT_KATEGORIEN = ["Frühstück", "Mittagessen", "Abendessen", "Snack"];

// ---------- Hilfsfunktionen ----------
const euro = (n) => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const kcalFmt = (n) => Math.round(n).toLocaleString("de-DE");
const preisPro100g = (z) => (z.einkaufsmenge > 0 ? (z.einkaufspreis / z.einkaufsmenge) * 100 : 0);
const startOfTodayISO = () => {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
};

// ---------- Kleine UI-Bausteine im Kassenbon-Stil ----------
function Bon({ children, className = "" }) {
  return (
    <div
      className={`relative bg-[#FAF7EF] border border-[#DCD4C0] rounded-sm shadow-sm ${className}`}
      style={{
        backgroundImage:
          "repeating-linear-gradient(transparent, transparent 27px, #ECE6D6 28px)",
      }}
    >
      {children}
    </div>
  );
}

function DottedRow({ left, right, sub, bold, accent }) {
  return (
    <div className="flex items-baseline gap-2 py-0.5">
      <span className={`whitespace-nowrap text-[13.5px] ${bold ? "font-semibold" : ""}`} style={{ color: "#2B2A28" }}>
        {left}
      </span>
      <span className="flex-1 border-b border-dotted translate-y-[-3px]" style={{ borderColor: "#B9AF97" }} />
      <span
        className={`whitespace-nowrap font-mono text-[13.5px] ${bold ? "font-bold" : ""}`}
        style={{ color: accent || "#2B2A28" }}
      >
        {right}
      </span>
      {sub && <span className="text-[11px] text-[#948B72] ml-1">{sub}</span>}
    </div>
  );
}

function SectionLabel({ children }) {
  return (
    <div className="text-[10.5px] tracking-[0.18em] uppercase font-semibold mb-2" style={{ color: "#8A8163" }}>
      {children}
    </div>
  );
}

function IconBtn({ onClick, children, danger, label }) {
  return (
    <button
      onClick={onClick}
      aria-label={label}
      className={`min-w-[40px] min-h-[40px] flex items-center justify-center rounded-full transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-[#6B6450] ${
        danger ? "hover:bg-[#F0DCD4] text-[#A85A3F]" : "hover:bg-[#E9E3D2] text-[#6B6450]"
      }`}
    >
      {children}
    </button>
  );
}

// ---------- Login / Registrierung ----------
function AuthScreen() {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setInfo("");
    setBusy(true);
    try {
      if (mode === "login") {
        const { error: err } = await sb.auth.signInWithPassword({ email, password });
        if (err) setError(err.message);
      } else {
        const { data, error: err } = await sb.auth.signUp({ email, password });
        if (err) {
          setError(err.message);
        } else if (!data.session) {
          setInfo("Fast geschafft — Bestätigungslink wurde an deine E-Mail geschickt.");
        }
      }
    } finally {
      setBusy(false);
    }
  };

  const googleSignIn = async () => {
    setError("");
    setInfo("");
    const { error: err } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin },
    });
    if (err) setError(err.message);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-6" style={{ background: "#EFEADA", fontFamily: "'Inter', system-ui, sans-serif" }}>
      <Bon className="p-5 w-full max-w-sm">
        <h1 className="text-[19px] font-bold tracking-tight text-[#2B2A28] mb-1">Kalorien &amp; Kosten</h1>
        <p className="text-[12px] text-[#8A8163] mb-4">{mode === "login" ? "Anmelden" : "Konto erstellen"}</p>

        <button
          type="button"
          onClick={googleSignIn}
          className="w-full flex items-center justify-center gap-2 py-2 rounded-sm border border-[#B9AF97] text-sm text-[#2B2A28] hover:bg-[#F0ECDC] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2B2A28] mb-3"
        >
          <svg width="16" height="16" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
            <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.5 0-13.9 4.2-17.2 10.4z"/>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.9 39.8 16.4 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.4-4.3 5.8l6.6 5.6C41.4 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/>
          </svg>
          Mit Google anmelden
        </button>

        <div className="flex items-center gap-2 mb-3">
          <div className="flex-1 h-px bg-[#DCD4C0]" />
          <span className="text-[11px] text-[#948B72]">oder</span>
          <div className="flex-1 h-px bg-[#DCD4C0]" />
        </div>

        <form onSubmit={submit} className="space-y-3">
          <input
            type="email"
            required
            aria-label="E-Mail"
            autoComplete="email"
            placeholder="E-Mail"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            className="w-full bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1.5 text-sm placeholder:text-[#A79E85]"
          />
          <input
            type="password"
            required
            minLength={6}
            aria-label="Passwort"
            autoComplete={mode === "login" ? "current-password" : "new-password"}
            placeholder="Passwort (mind. 6 Zeichen)"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            className="w-full bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1.5 text-sm placeholder:text-[#A79E85]"
          />

          {error && <p className="text-[12px] text-[#A85A3F]">{error}</p>}
          {info && <p className="text-[12px] text-[#5C6B4F]">{info}</p>}

          <button
            type="submit"
            disabled={busy}
            className="w-full py-2 rounded-sm bg-[#5C6B4F] text-[#FAF7EF] text-sm font-medium hover:bg-[#4C5A41] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2B2A28] disabled:opacity-50"
          >
            {mode === "login" ? "Anmelden" : "Registrieren"}
          </button>
        </form>

        <button
          onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); setInfo(""); }}
          className="mt-3 w-full text-center text-[12px] text-[#6B6450] underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5C6B4F]"
        >
          {mode === "login" ? "Noch kein Konto? Registrieren" : "Schon ein Konto? Anmelden"}
        </button>
      </Bon>

      <footer className="mt-4 text-center text-[11px] text-[#8A8163]">
        <a href="/impressum" className="underline">Impressum</a>
        <span className="mx-2">·</span>
        <a href="/datenschutz" className="underline">Datenschutz</a>
      </footer>
    </div>
  );
}

// ---------- Zutaten-Tab ----------
function ZutatenTab({ zutaten, onAdd }) {
  const [form, setForm] = useState({ name: "", kcal100: "", einkaufsmenge: "", einkaufspreis: "" });
  const [busy, setBusy] = useState(false);
  const [hint, setHint] = useState("");

  const add = async () => {
    if (!form.name || !form.kcal100 || !form.einkaufsmenge || !form.einkaufspreis) {
      setHint("Bitte alle Felder ausfüllen.");
      return;
    }
    setHint("");
    setBusy(true);
    try {
      await onAdd({
        name: form.name,
        kcal100: parseFloat(form.kcal100),
        einkaufsmenge: parseFloat(form.einkaufsmenge),
        einkaufspreis: parseFloat(form.einkaufspreis),
      });
      setForm({ name: "", kcal100: "", einkaufsmenge: "", einkaufspreis: "" });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="space-y-4 pb-4">
      <Bon className="p-4">
        <SectionLabel>Zutaten-Register</SectionLabel>
        {zutaten.map((z) => (
          <div key={z.id} className="group">
            <DottedRow
              left={z.name}
              right={`${euro(preisPro100g(z))}/100g`}
              sub={`${z.kcal100} kcal/100g`}
            />
          </div>
        ))}
        {zutaten.length === 0 && <p className="text-sm text-[#948B72] italic">Noch keine Zutaten angelegt.</p>}
      </Bon>

      <Bon className="p-4">
        <SectionLabel>Neue Zutat erfassen</SectionLabel>
        <div className="grid grid-cols-2 gap-2">
          <input
            placeholder="Name"
            aria-label="Name der Zutat"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            className="col-span-2 bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm placeholder:text-[#A79E85]"
          />
          <input
            placeholder="kcal / 100g"
            aria-label="Kilokalorien pro 100 Gramm"
            type="number"
            inputMode="decimal"
            value={form.kcal100}
            onChange={(e) => setForm({ ...form, kcal100: e.target.value })}
            className="bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm placeholder:text-[#A79E85]"
          />
          <input
            placeholder="Einkaufsmenge (g)"
            aria-label="Einkaufsmenge in Gramm"
            type="number"
            inputMode="decimal"
            value={form.einkaufsmenge}
            onChange={(e) => setForm({ ...form, einkaufsmenge: e.target.value })}
            className="bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm placeholder:text-[#A79E85]"
          />
          <input
            placeholder="Einkaufspreis (€)"
            aria-label="Einkaufspreis in Euro"
            type="number"
            step="0.01"
            inputMode="decimal"
            value={form.einkaufspreis}
            onChange={(e) => setForm({ ...form, einkaufspreis: e.target.value })}
            className="col-span-2 bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm placeholder:text-[#A79E85]"
          />
        </div>
        {hint && <p className="mt-2 text-[12px] text-[#A85A3F]">{hint}</p>}
        <button
          onClick={add}
          disabled={busy}
          className="mt-3 w-full flex items-center justify-center gap-1.5 bg-[#5C6B4F] text-[#FAF7EF] text-sm font-medium py-2 rounded-sm hover:bg-[#4C5A41] transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2B2A28] disabled:opacity-50"
        >
          <PlusIcon size={15} /> Zutat speichern
        </button>
        <p className="mt-2 text-[11px] text-[#948B72] flex items-center gap-1">
          <ReceiptIcon size={12} /> Kassenzettel-Scan folgt als eigener Import-Weg (Prototyp: manuell).
        </p>
      </Bon>
    </div>
  );
}

// ---------- Rezepte-Tab ----------
function RezepteTab({ zutaten, rezepte, onSave }) {
  const [editing, setEditing] = useState(null); // rezept object being built
  const [name, setName] = useState("");
  const [portionen, setPortionen] = useState(1);
  const [lines, setLines] = useState([]); // {zutatId, menge}
  const [pickZutat, setPickZutat] = useState("");
  const [pickMenge, setPickMenge] = useState("");
  const [busy, setBusy] = useState(false);
  const [hint, setHint] = useState("");

  const startNew = () => {
    setEditing("new");
    setName("");
    setPortionen(1);
    setLines([]);
    setHint("");
  };

  const berechne = (linesArg, portionenArg) => {
    let kcal = 0, kosten = 0;
    linesArg.forEach((l) => {
      const z = zutaten.find((zz) => zz.id === l.zutatId);
      if (!z) return;
      kcal += (z.kcal100 / 100) * l.menge;
      kosten += (preisPro100g(z) / 100) * l.menge;
    });
    return { kcal, kosten, kcalPortion: kcal / portionenArg, kostenPortion: kosten / portionenArg };
  };

  const addLine = () => {
    if (!pickZutat || !pickMenge) return;
    setLines((l) => [...l, { zutatId: pickZutat, menge: parseFloat(pickMenge) }]);
    setPickZutat("");
    setPickMenge("");
  };

  const save = async () => {
    if (!name || lines.length === 0) {
      setHint(!name ? "Bitte einen Namen für das Rezept eingeben." : "Bitte mindestens eine Zutat hinzufügen.");
      return;
    }
    setHint("");
    setBusy(true);
    try {
      await onSave({ name, portionen, zutaten: lines });
      setEditing(null);
    } finally {
      setBusy(false);
    }
  };

  if (editing) {
    const totals = berechne(lines, portionen || 1);
    return (
      <div className="space-y-4 pb-4">
        <Bon className="p-4">
          <SectionLabel>Rezept zusammenstellen</SectionLabel>
          <input
            placeholder="Name des Rezepts"
            aria-label="Name des Rezepts"
            value={name}
            onChange={(e) => setName(e.target.value)}
            className="w-full bg-transparent border-b border-[#B9AF97] focus:border-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm mb-2 placeholder:text-[#A79E85]"
          />
          <div className="flex items-center gap-2 mb-3">
            <label className="text-[13px] text-[#6B6450]">Portionen</label>
            <input
              type="number"
              inputMode="numeric"
              min={1}
              value={portionen}
              onChange={(e) => setPortionen(parseInt(e.target.value) || 1)}
              className="w-16 bg-transparent border-b border-[#B9AF97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm"
            />
          </div>

          {lines.map((l, i) => {
            const z = zutaten.find((zz) => zz.id === l.zutatId);
            return (
              <div key={i} className="flex items-center gap-2">
                <DottedRow left={`${z?.name || "?"} · ${l.menge}g`} right={""} />
                <IconBtn danger label={`${z?.name || "Position"} entfernen`} onClick={() => setLines((ls) => ls.filter((_, idx) => idx !== i))}>
                  <XIcon size={14} />
                </IconBtn>
              </div>
            );
          })}

          <div className="flex gap-2 mt-2">
            <select
              value={pickZutat}
              aria-label="Zutat wählen"
              onChange={(e) => setPickZutat(e.target.value)}
              className="flex-1 bg-transparent border-b border-[#B9AF97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm"
            >
              <option value="">Zutat wählen…</option>
              {zutaten.map((z) => (
                <option key={z.id} value={z.id}>
                  {z.name}
                </option>
              ))}
            </select>
            <input
              placeholder="g"
              aria-label="Menge in Gramm"
              type="number"
              inputMode="decimal"
              value={pickMenge}
              onChange={(e) => setPickMenge(e.target.value)}
              className="w-16 bg-transparent border-b border-[#B9AF97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm"
            />
            <IconBtn label="Zutat zum Rezept hinzufügen" onClick={addLine}>
              <PlusIcon size={16} />
            </IconBtn>
          </div>
        </Bon>

        <Bon className="p-4">
          <SectionLabel>Live-Berechnung</SectionLabel>
          <DottedRow left="Gesamt" right={`${kcalFmt(totals.kcal)} kcal`} accent="#5C6B4F" bold />
          <DottedRow left="Gesamt" right={euro(totals.kosten)} accent="#B08628" bold />
          <div className="h-px bg-[#DCD4C0] my-2" />
          <DottedRow left="Pro Portion" right={`${kcalFmt(totals.kcalPortion)} kcal`} accent="#5C6B4F" bold />
          <DottedRow left="Pro Portion" right={euro(totals.kostenPortion)} accent="#B08628" bold />
        </Bon>

        {hint && <p className="text-[12px] text-[#A85A3F]">{hint}</p>}

        <div className="flex gap-2">
          <button
            onClick={() => setEditing(null)}
            className="flex-1 py-2 rounded-sm border border-[#B9AF97] text-sm text-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6B6450]"
          >
            Abbrechen
          </button>
          <button
            onClick={save}
            disabled={busy}
            className="flex-1 py-2 rounded-sm bg-[#5C6B4F] text-[#FAF7EF] text-sm font-medium hover:bg-[#4C5A41] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2B2A28] disabled:opacity-50"
          >
            Rezept speichern
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-3 pb-4">
      {rezepte.map((r) => {
        const t = berechne(r.zutaten, r.portionen);
        return (
          <Bon key={r.id} className="p-4">
            <div className="flex items-center justify-between mb-1">
              <span className="font-semibold text-[#2B2A28]">{r.name}</span>
              <span className="text-[11px] text-[#948B72]">{r.portionen} Portion(en)</span>
            </div>
            <DottedRow left="Pro Portion" right={`${kcalFmt(t.kcalPortion)} kcal`} accent="#5C6B4F" />
            <DottedRow left="Pro Portion" right={euro(t.kostenPortion)} accent="#B08628" />
          </Bon>
        );
      })}
      <button
        onClick={startNew}
        className="w-full flex items-center justify-center gap-1.5 bg-[#5C6B4F] text-[#FAF7EF] text-sm font-medium py-2 rounded-sm hover:bg-[#4C5A41] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2B2A28]"
      >
        <PlusIcon size={15} /> Neues Rezept
      </button>
    </div>
  );
}

// ---------- Log-Tab ----------
function LogTab({ rezepte, zutaten, log, onAdd, onDelete }) {
  const [rezeptId, setRezeptId] = useState("");
  const [faktor, setFaktor] = useState(1);
  const [kategorie, setKategorie] = useState(MAHLZEIT_KATEGORIEN[0]);
  const [busy, setBusy] = useState(false);
  const [hint, setHint] = useState("");

  const berechne = (rezept, faktorArg) => {
    let kcal = 0, kosten = 0;
    rezept.zutaten.forEach((l) => {
      const z = zutaten.find((zz) => zz.id === l.zutatId);
      if (!z) return;
      kcal += (z.kcal100 / 100) * l.menge;
      kosten += (preisPro100g(z) / 100) * l.menge;
    });
    const proPortion = { kcal: kcal / rezept.portionen, kosten: kosten / rezept.portionen };
    return { kcal: proPortion.kcal * faktorArg, kosten: proPortion.kosten * faktorArg };
  };

  const heute = new Date().toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });

  const addEntry = async () => {
    const rezept = rezepte.find((r) => r.id === rezeptId);
    if (!rezept) {
      setHint("Bitte ein Rezept auswählen.");
      return;
    }
    setHint("");
    const t = berechne(rezept, faktor);
    setBusy(true);
    try {
      await onAdd(rezept, faktor, t, kategorie);
    } finally {
      setBusy(false);
    }
  };

  const usedKategorien = [...new Set(log.map((e) => e.kategorie))];
  const katOrder = [...MAHLZEIT_KATEGORIEN, ...usedKategorien.filter((k) => !MAHLZEIT_KATEGORIEN.includes(k))];
  const gruppen = katOrder
    .map((kat) => ({ kat, eintraege: log.filter((e) => e.kategorie === kat) }))
    .filter((g) => g.eintraege.length > 0);

  return (
    <div className="space-y-4 pb-4">
      <Bon className="p-4">
        <SectionLabel>Mahlzeit einbuchen — {heute}</SectionLabel>
        <select
          value={kategorie}
          aria-label="Mahlzeit-Kategorie"
          onChange={(e) => setKategorie(e.target.value)}
          className="w-full bg-transparent border-b border-[#B9AF97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm mb-2"
        >
          {MAHLZEIT_KATEGORIEN.map((kat) => (
            <option key={kat} value={kat}>
              {kat}
            </option>
          ))}
        </select>
        <div className="flex gap-2 mb-2">
          <select
            value={rezeptId}
            aria-label="Rezept wählen"
            onChange={(e) => setRezeptId(e.target.value)}
            className="flex-1 bg-transparent border-b border-[#B9AF97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm"
          >
            <option value="">Rezept wählen…</option>
            {rezepte.map((r) => (
              <option key={r.id} value={r.id}>
                {r.name}
              </option>
            ))}
          </select>
          <input
            type="number"
            inputMode="decimal"
            step="0.25"
            min="0.25"
            aria-label="Portionsfaktor"
            value={faktor}
            onChange={(e) => setFaktor(parseFloat(e.target.value) || 1)}
            className="w-16 bg-transparent border-b border-[#B9AF97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#5C6B4F] focus-visible:outline-offset-2 py-1 text-sm"
          />
        </div>
        {hint && <p className="text-[12px] text-[#A85A3F] mb-2">{hint}</p>}
        <button
          onClick={addEntry}
          disabled={busy}
          className="w-full flex items-center justify-center gap-1.5 bg-[#5C6B4F] text-[#FAF7EF] text-sm font-medium py-2 rounded-sm hover:bg-[#4C5A41] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2B2A28] disabled:opacity-50"
        >
          <PlusIcon size={15} /> Einbuchen ({faktor}× Portion)
        </button>
      </Bon>

      <Bon className="p-4">
        <SectionLabel>Heutiger Bon</SectionLabel>
        {log.length === 0 && <p className="text-sm text-[#948B72] italic">Noch nichts gegessen heute.</p>}
        {gruppen.map((g) => (
          <div key={g.kat} className="mb-3 last:mb-0">
            <div className="text-[10px] uppercase tracking-wide text-[#B08628] font-semibold mb-1">{g.kat}</div>
            {g.eintraege.map((e) => (
              <div key={e.id} className="flex items-center gap-2">
                <DottedRow
                  left={`${e.rezeptName}${e.faktor !== 1 ? ` ×${e.faktor}` : ""}`}
                  right={euro(e.kosten)}
                  sub={`${kcalFmt(e.kcal)} kcal`}
                />
                <IconBtn danger label={`${e.rezeptName} löschen`} onClick={() => onDelete(e.id)}>
                  <TrashIcon size={13} />
                </IconBtn>
              </div>
            ))}
          </div>
        ))}
      </Bon>
    </div>
  );
}

// ---------- Dashboard-Tab ----------
function DashboardTab({ log }) {
  const totals = useMemo(() => {
    const kcal = log.reduce((s, e) => s + e.kcal, 0);
    const kosten = log.reduce((s, e) => s + e.kosten, 0);
    return { kcal, kosten, kcalProEuro: kosten > 0 ? kcal / kosten : 0 };
  }, [log]);

  return (
    <div className="space-y-4 pb-4">
      <Bon className="p-5">
        <SectionLabel>Tagesbilanz</SectionLabel>
        <div className="grid grid-cols-2 gap-4 mt-2">
          <div className="flex flex-col items-center py-3 rounded-sm bg-[#EFEADA]">
            <FlameIcon size={20} color="#5C6B4F" className="mb-1" />
            <span className="font-mono text-xl font-bold text-[#2B2A28]">{kcalFmt(totals.kcal)}</span>
            <span className="text-[10.5px] uppercase tracking-wide text-[#8A8163]">kcal heute</span>
          </div>
          <div className="flex flex-col items-center py-3 rounded-sm bg-[#EFEADA]">
            <CoinsIcon size={20} color="#B08628" className="mb-1" />
            <span className="font-mono text-xl font-bold text-[#2B2A28]">{euro(totals.kosten)}</span>
            <span className="text-[10.5px] uppercase tracking-wide text-[#8A8163]">Kosten heute</span>
          </div>
        </div>
      </Bon>

      <Bon className="p-4">
        <SectionLabel>Kennzahl</SectionLabel>
        <DottedRow
          left="kcal pro ausgegebenem Euro"
          right={totals.kosten > 0 ? kcalFmt(totals.kcalProEuro) : "–"}
          accent="#5C6B4F"
          bold
        />
        <p className="text-[11px] text-[#948B72] mt-2">
          Höherer Wert = kalorienreicher pro Euro. Dient nur als grobe Orientierung, nicht als Nährwert-Ranking.
        </p>
      </Bon>

      {log.length === 0 && (
        <Bon className="p-4">
          <p className="text-sm text-[#948B72] italic">Noch keine Einträge — buch im Log-Tab deine erste Mahlzeit ein.</p>
        </Bon>
      )}
    </div>
  );
}

// ---------- Eingeloggte App ----------
function MainApp({ session }) {
  const [zutaten, setZutaten] = useState([]);
  const [rezepte, setRezepte] = useState([]);
  const [log, setLog] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [tab, setTab] = useState("zutaten");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const [zRes, rRes, lRes] = await Promise.all([
        sb.from("zutaten").select("*").order("created_at"),
        sb.from("rezepte").select("id, name, portionen, rezept_zutaten(zutat_id, menge)").order("created_at"),
        sb.from("log_eintraege").select("*").gte("zeit", startOfTodayISO()).order("zeit", { ascending: false }),
      ]);
      if (cancelled) return;
      const err = zRes.error || rRes.error || lRes.error;
      if (err) {
        setLoadError(err.message);
        setLoading(false);
        return;
      }
      setZutaten(zRes.data);
      setRezepte(
        rRes.data.map((r) => ({
          id: r.id,
          name: r.name,
          portionen: r.portionen,
          zutaten: (r.rezept_zutaten || []).map((rz) => ({ zutatId: rz.zutat_id, menge: rz.menge })),
        }))
      );
      setLog(
        lRes.data.map((e) => ({
          id: e.id,
          rezeptName: e.rezept_name,
          faktor: e.faktor,
          kcal: e.kcal,
          kosten: e.kosten,
          zeit: e.zeit,
          kategorie: e.kategorie,
        }))
      );
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, []);

  const addZutat = async (werte) => {
    const { data, error } = await sb.from("zutaten").insert(werte).select().single();
    if (error) { setLoadError(error.message); return; }
    setZutaten((z) => [...z, data]);
  };

  const addRezept = async ({ name, portionen, zutaten: lines }) => {
    const { data: rezeptRow, error } = await sb.from("rezepte").insert({ name, portionen }).select().single();
    if (error) { setLoadError(error.message); return; }
    const zeilen = lines.map((l) => ({ rezept_id: rezeptRow.id, zutat_id: l.zutatId, menge: l.menge }));
    const { error: zErr } = await sb.from("rezept_zutaten").insert(zeilen);
    if (zErr) { setLoadError(zErr.message); return; }
    setRezepte((r) => [...r, { id: rezeptRow.id, name: rezeptRow.name, portionen: rezeptRow.portionen, zutaten: lines }]);
  };

  const addLogEntry = async (rezept, faktor, totals, kategorie) => {
    const { data, error } = await sb
      .from("log_eintraege")
      .insert({ rezept_id: rezept.id, rezept_name: rezept.name, faktor, kcal: totals.kcal, kosten: totals.kosten, kategorie })
      .select()
      .single();
    if (error) { setLoadError(error.message); return; }
    setLog((l) => [
      { id: data.id, rezeptName: data.rezept_name, faktor: data.faktor, kcal: data.kcal, kosten: data.kosten, zeit: data.zeit, kategorie: data.kategorie },
      ...l,
    ]);
  };

  const deleteLogEntry = async (id) => {
    const { error } = await sb.from("log_eintraege").delete().eq("id", id);
    if (error) { setLoadError(error.message); return; }
    setLog((l) => l.filter((x) => x.id !== id));
  };

  const tabs = [
    { id: "zutaten", label: "Zutaten", icon: ReceiptIcon },
    { id: "rezepte", label: "Rezepte", icon: BookOpenIcon },
    { id: "log", label: "Log", icon: CalendarIcon },
    { id: "dashboard", label: "Bilanz", icon: DashboardIcon },
  ];

  return (
    <div className="min-h-screen flex flex-col" style={{ background: "#EFEADA", fontFamily: "'Inter', system-ui, sans-serif" }}>
      <header className="px-5 pt-6 pb-4 flex items-start justify-between gap-3">
        <div>
          <h1 className="text-[19px] font-bold tracking-tight text-[#2B2A28]">Kalorien &amp; Kosten</h1>
          <p className="text-[12px] text-[#8A8163]">jede Zutat, doppelt verbucht</p>
          <p className="text-[10px] text-[#A79E85] mt-1">
            <a href="/impressum" className="underline">Impressum</a>
            <span className="mx-1">·</span>
            <a href="/datenschutz" className="underline">Datenschutz</a>
          </p>
        </div>
        <button
          onClick={() => sb.auth.signOut()}
          className="flex items-center gap-1 text-[11px] text-[#8A8163] hover:text-[#6B6450] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6B6450] pt-1"
          title={session.user.email}
          aria-label={`Abmelden (angemeldet als ${session.user.email})`}
        >
          <LogOutIcon size={14} /> Abmelden
        </button>
      </header>

      {loadError && (
        <div className="px-4 mb-2 max-w-md w-full mx-auto">
          <p className="text-[12px] text-[#A85A3F]">{loadError}</p>
        </div>
      )}

      <main className="flex-1 px-4 max-w-md w-full mx-auto overflow-y-auto">
        {loading ? (
          <Bon className="p-4">
            <p className="text-sm text-[#948B72] italic">Lädt…</p>
          </Bon>
        ) : (
          <React.Fragment>
            {tab === "zutaten" && <ZutatenTab zutaten={zutaten} onAdd={addZutat} />}
            {tab === "rezepte" && <RezepteTab zutaten={zutaten} rezepte={rezepte} onSave={addRezept} />}
            {tab === "log" && <LogTab rezepte={rezepte} zutaten={zutaten} log={log} onAdd={addLogEntry} onDelete={deleteLogEntry} />}
            {tab === "dashboard" && <DashboardTab log={log} />}
          </React.Fragment>
        )}
      </main>

      <nav className="sticky bottom-0 bg-[#FAF7EF] border-t border-[#DCD4C0] flex justify-around py-2 max-w-md w-full mx-auto">
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              aria-current={active ? "page" : undefined}
              className="flex flex-col items-center gap-0.5 px-3 py-2 min-h-[44px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-[#5C6B4F]"
            >
              <Icon size={18} color={active ? "#5C6B4F" : "#A79E85"} />
              <span className={`text-[10px] ${active ? "text-[#5C6B4F] font-semibold" : "text-[#A79E85]"}`}>
                {t.label}
              </span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

// ---------- Root: Auth-Gate ----------
function Root() {
  const [session, setSession] = useState(undefined); // undefined = wird geladen, null = ausgeloggt

  useEffect(() => {
    if (!SUPABASE_CONFIGURED) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!SUPABASE_CONFIGURED) return <SetupNotice />;
  if (session === undefined) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: "#EFEADA" }}>
        <p className="text-sm text-[#948B72] italic">Lädt…</p>
      </div>
    );
  }
  if (!session) return <AuthScreen />;
  return <MainApp session={session} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
